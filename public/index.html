<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valencia.GPT</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f7f7f7;
        }

        h1 {
            font-weight: bold;
            color: white;
            background-color: #dd0707;
            padding: 20px;
            width: 100%;
            text-align: center;
        }

        .chatbox {
            width: 90%;
            max-width: 600px;
            height: 400px;
            border: 2px solid #ccc;
            border-radius: 10px;
            overflow-y: auto;
            padding: 10px;
            background: white;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .message {
            margin-bottom: 10px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.3s forwards;
        }

        .message.user { color: blue; }
        .message.bot { color: green; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        #input {
            padding: 10px;
            width: 400px;
            max-width: 70%;
        }

        button {
            padding: 10px 15px;
            border: none;
            background-color: #dd0707;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #aa0505;
        }
    </style>
</head>
<body>
    <h1>Valencia.GPT tu IA valenciana</h1>
    <div class="chatbox" id="chatbox"></div>
    <div class="controls">
        <input type="text" id="input" placeholder="Escribe tu mensaje" />
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('input');
            const message = input.value;
            const chatbox = document.getElementById('chatbox');

            if (!message.trim()) return;

            const userMessage = document.createElement('div');
            userMessage.className = 'message user';
            userMessage.textContent = `Tú: ${message}`;
            chatbox.appendChild(userMessage);
            chatbox.scrollTop = chatbox.scrollHeight;

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: message })
                });

                const data = await response.json();

                const botMessage = document.createElement('div');
                botMessage.className = 'message bot';
                botMessage.textContent = `IA: ${data}`;
                chatbox.appendChild(botMessage);
                chatbox.scrollTop = chatbox.scrollHeight;

                input.value = '';
            } catch (error) {
                console.error('Error:', error);
                alert('Error al conectar con la IA.');
            }
        }
    </script>
</body>
</html>
